research:
  introduction: Making neurotechnology more accessible, reliable, and useful in everyday life.
  themes:
  - label: 01 / HARDWARE
    title_lines:
    - Neuroprosthetics &
    - EEG hardware
    description: Working toward low-cost, high-performance EEG-controlled robotic prosthetic hands and
      the EEG hardware to support them.
  - label: 02 / PEOPLE
    title_lines:
    - Amputee-centered
    - brain–computer interfaces
    description: Exploring motor-imagery decoding and prosthetic control with the needs of people with
      limb loss at the center.
  - label: 03 / LONGEVITY
    title_lines:
    - Long-term BCI &
    - EEG drift compensation
    description: Investigating how to accommodate changes in EEG over time, with the goal of sustaining
      reliable brain–computer interface use.
  - label: 04 / BRAIN HEALTH
    title_lines:
    - Brain aging &
    - neural biomarkers
    description: Interested in brain-health biomarkers for early dementia detection and research into
      approaches that may help delay its onset.
